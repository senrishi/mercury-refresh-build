name: Free standard macOS build
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify packaging without Firefox compilation, or build Firefox
        type: choice
        options: [verify, build]
        default: verify
      release_tag:
        description: Fixed tag/draft release created by scripts/dispatch.py
        type: string
        required: true
      resume_tag:
        description: Complete checkpoint key in the same draft release
        type: string
        default: ''
      generation:
        type: string
        default: '1'
permissions:
  contents: write
  actions: write
concurrency:
  group: macos-build
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false && github.repository == 'senrishi/mercury-refresh-build'
    runs-on: macos-26
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RESUME_TAG: ${{ inputs.resume_tag }}
      GENERATION: ${{ inputs.generation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify fixed release upload access before compilation
        run: python3 scripts/release-access.py
      - name: Check checkpoint helpers with synthetic fixtures
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Check pinned upstream identity and patch application
        run: python3 scripts/check-config.py
      - name: Validate segment and reserve checkpoint time
        run: |
          python3 - <<'PY'
          import os, re, time
          assert os.environ['GENERATION'] in ('1','2','3','4')
          assert os.environ['BUILD_MODE'] in ('verify','build')
          tag=os.environ['RESUME_TAG']
          assert not tag or re.fullmatch(r'checkpoint-\d+-\d+',tag)
          with open(os.environ['GITHUB_ENV'],'a') as result:
              result.write(f'BUILD_DEADLINE={int(time.time())+210*60}\n')
          PY
      - name: Select pinned Xcode and record environment
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          { sw_vers; uname -a; df -h; xcodebuild -version; xcrun --show-sdk-version; } > output/runner.txt 2>&1
          cp upstream.json product.json output/
      - name: Exercise actual DMG validation with synthetic app and nested helpers
        if: inputs.mode == 'verify'
        run: python3 scripts/verify-packaging.py
      - name: Compile and preserve original package before downstream validation
        if: inputs.mode == 'build'
        id: compile
        run: |
          set +e
          bash scripts/build.sh
          RESULT=$?
          set -e
          if [ "$RESULT" -eq 75 ]; then
            echo 'checkpoint=true' >> "$GITHUB_OUTPUT"
          else
            exit "$RESULT"
          fi
      - name: Save stopped incremental build to existing draft release
        id: checkpoint
        if: steps.compile.outputs.checkpoint == 'true'
        run: |
          KEY="checkpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/checkpoint.py save "$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Preserve logs, packages and checksums in the existing release
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: python3 scripts/publish.py
      - name: Resume complete checkpoint in another free job
        if: success() && steps.checkpoint.outputs.key != ''
        env:
          CHECKPOINT_KEY: ${{ steps.checkpoint.outputs.key }}
        run: |
          if [ "$GENERATION" -ge 4 ]; then
            echo 'Four-segment limit reached; checkpoint retained for review.'
            exit 0
          fi
          gh workflow run build.yml --ref "$RELEASE_TAG" -f mode=build -f "release_tag=$RELEASE_TAG" -f "resume_tag=$CHECKPOINT_KEY" -f "generation=$((GENERATION+1))"
