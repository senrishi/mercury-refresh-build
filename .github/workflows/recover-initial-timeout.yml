name: Recover initial build only if timed out
on:
  workflow_run:
    workflows: ['Free standard macOS build']
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: recover-initial-build-43481496635
  cancel-in-progress: false
jobs:
  recover:
    if: github.event.repository.private == false && github.repository == 'senrishi/mercury-refresh-build' && github.event.workflow_run.id == 43481496635
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Retry only a confirmed execution timeout
        run: |
          gh api "repos/$GH_REPO/actions/runs/43481496635/jobs" > /tmp/initial-jobs.json
          python3 - <<'PYCODE'
          import json, os, subprocess
          jobs = json.load(open('/tmp/initial-jobs.json'))['jobs']
          timed_out = any(job['conclusion'] == 'timed_out' for job in jobs)
          for job in jobs:
              annotations = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/check-runs/{job['id']}/annotations"], text=True))
              timed_out |= any('exceeded the maximum execution time' in item.get('message', '').lower() for item in annotations)
          with open('/tmp/confirmed-timeout', 'w') as result:
              result.write(str(timed_out).lower())
          PYCODE
          if [ "$(cat /tmp/confirmed-timeout)" = true ]; then
            gh workflow run build.yml --ref main -f generation=1
            echo 'Initial job timed out. Started first checkpoint-enabled segment.'
          else
            echo 'Initial job did not time out. No retry requested.'
          fi
